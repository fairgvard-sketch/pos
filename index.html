<!doctype html>
<!-- Иврит-only прод (P3-14): стартовый lang/dir = he/rtl, чтобы не было
     LTR-вспышки до гидрации langStore; на внутренних сборках store сам
     переключит документ на выбранный язык -->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS «На экран Домой» берёт иконку ТОЛЬКО отсюда: icons из manifest
         Safari для домашнего экрана не использует. Без этого тега на экран
         попадает скриншот страницы вместо логотипа. -->
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- Гостевые страницы (меню, заказ, бронь) попадают в мессенджеры и
         поиск ссылкой. Без описания и og-тегов превью выглядело пустым;
         конкретное имя заведения проставляет сама страница после загрузки. -->
    <meta name="description" content="__ANGLE_APP_DESCRIPTION__" />
    <meta property="og:title" content="__ANGLE_APP_TITLE__" />
    <meta property="og:description" content="__ANGLE_APP_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#f8f9fb" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- До загрузки React выбираем ровно один manifest. Safari загружает его
         во время разбора страницы, поэтому guest/POS нельзя переключать позже. -->
    <script>window.__ANGLE_APP_SURFACE__ = '__ANGLE_APP_SURFACE_VALUE__'</script>
    <script src="/install-manifest.js"></script>
    <title>__ANGLE_APP_TITLE__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
